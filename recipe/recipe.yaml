schema_version: 1

context:
  version: "2.3.0"

package:
  name: cc-plugin-glider
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cc-plugin-glider/cc_plugin_glider-${{ version }}.tar.gz
  sha256: 5056dd333fd6f11af0a5c36de1193ca689889e5d682167bc220307895f933209

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - gliderdac = cc_plugin_glider.glider_dac:GliderCheck

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - compliance-checker >=5.4.1

tests:
  - python:
      imports:
        - cc_plugin_glider
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Compliance Checker Glider DAC plugin
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/cc-plugin-glider/

extra:
  recipe-maintainers:
    - ocefpaf
